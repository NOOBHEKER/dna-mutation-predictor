[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-mutation-predictor"
version = "1.0.0"
description = "Research-grade missense-variant triage with ESM-2 protein embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NOOBHEKER" }]
keywords = [
  "bioinformatics",
  "genomics",
  "protein-language-model",
  "esm-2",
  "variant-effect-prediction",
  "clinvar",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "xgboost>=2.0,<4",
  "requests>=2.31,<3",
  "tqdm>=4.65,<5",
  "rich>=13.0,<15",
  "prompt-toolkit>=3.0,<4",
  "plotly>=5.18,<8",
  "matplotlib>=3.7,<4",
  "biopython>=1.81,<2",
  "torch>=2.0,<3",
  "transformers>=4.35,<6",
  "onnxruntime>=1.16,<2",
]

[project.optional-dependencies]
web = ["streamlit>=1.30,<2"]
train = ["lightgbm>=4.0,<5", "catboost>=1.2,<2"]
dev = ["pytest>=8.0,<10", "ruff>=0.6,<1", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/NOOBHEKER/dna-mutation-predictor"
Repository = "https://github.com/NOOBHEKER/dna-mutation-predictor"
Issues = "https://github.com/NOOBHEKER/dna-mutation-predictor/issues"
Changelog = "https://github.com/NOOBHEKER/dna-mutation-predictor/blob/main/CHANGELOG.md"

[project.scripts]
dna-predict = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "venv", "__pycache__", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"src/preprocess.py" = ["E402"]
"src/evaluate.py" = ["E402"]
"src/train.py" = ["E402"]
