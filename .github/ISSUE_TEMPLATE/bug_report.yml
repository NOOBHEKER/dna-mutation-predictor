name: Bug report
description: Report a reproducible problem
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include API keys, tokens, or patient data.**
        For security issues, use the private process in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Exact commands, input variant, and any relevant file state.
      placeholder: |
        1. Run `python -m src.cli`
        2. Enter `TP53 R175H`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / logs
      render: shell
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS 15"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install?
      options:
        - predict.bat / predict.sh
        - manual venv + requirements.txt
        - pip install .
        - other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
